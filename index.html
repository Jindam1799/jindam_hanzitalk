<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <title>진담한자톡</title>
    <meta name="description" content="부수로 배우는 한자 쓰기 게임, 진담한자톡" />
    <meta name="theme-color" content="#e11d48" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="진담한자톡" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="format-detection" content="telephone=no" />
    <link rel="manifest" href="manifest.json" />
    <link rel="icon" type="image/png" href="icons/favicon.png" />
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />

    <!-- 크롬에서 열기: 카카오톡·인스타·네이버 등 인앱 브라우저와 안드로이드의 다른 브라우저를 크롬으로 보냄 -->
    <script>
      (function () {
        if (!/^https?:$/.test(location.protocol)) return; // 내 PC에서 파일로 열 때는 건너뜀
        var standalone =
          navigator.standalone === true ||
          (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches);
        if (standalone) return; // 홈 화면 아이콘으로 실행한 경우는 그대로 사용
        var ua = navigator.userAgent;
        var isAndroid = /android/i.test(ua);
        var isIOS =
          /iphone|ipad|ipod/i.test(ua) ||
          (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
        var inAppRe =
          /kakaotalk|naver\(|naver\/|instagram|fban|fbav|fb_iab|line\/|daumapps|everytimeapp|band\/|twitter|snapchat|; wv\)/i;
        var isChrome = isAndroid
          ? /chrome\/\d/i.test(ua) &&
            !/samsungbrowser|whale|edga?\/|opr\/|yabrowser|miuibrowser|huaweibrowser|vivobrowser|heytapbrowser/i.test(ua) &&
            !inAppRe.test(ua)
          : /crios/i.test(ua);
        window.__jindamChrome = { isChrome: isChrome, isIOS: isIOS, isAndroid: isAndroid };
        if (isChrome) return;

        // 같은 세션에서 한 번만 시도 (무한 이동 방지)
        var tried = false;
        try {
          tried = sessionStorage.getItem('jindamChromeTried') === '1';
          sessionStorage.setItem('jindamChromeTried', '1');
        } catch (e) {}
        if (tried) return;

        var url = location.href;
        if (isAndroid) {
          location.href =
            'intent://' + url.replace(/^https?:\/\//, '') +
            '#Intent;scheme=' + location.protocol.replace(':', '') +
            ';package=com.android.chrome;end';
        } else if (/kakaotalk/i.test(ua)) {
          location.href = 'kakaotalk://web/openExternal?url=' + encodeURIComponent(url);
        } else if (isIOS && /line\//i.test(ua) && url.indexOf('openExternalBrowser') < 0) {
          location.href = url + (url.indexOf('?') < 0 ? '?' : '&') + 'openExternalBrowser=1';
        }
      })();
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700;900&family=Noto+Sans+SC:wght@400;700&display=swap"
    />
    <link rel="stylesheet" href="style.css" />
    <script src="https://cdn.jsdelivr.net/npm/hanzi-writer@3.5/dist/hanzi-writer.min.js"></script>
  </head>
  <body>
    <!-- 시작 화면 -->
    <section id="intro-screen" class="screen active">
      <div class="intro-content">
        <img class="intro-icon" src="icons/icon-192.png" alt="" />
        <p class="brand-subtitle">진심을 담은 중국어, <strong>진담중국어</strong></p>
        <h1>진담한자톡</h1>
        <p class="blink-text">화면을 터치하여 시작하세요</p>
      </div>
    </section>

    <!-- 목록 화면 (학습·복습장·시험장 공용) -->
    <section id="home-screen" class="screen">
      <header class="header">
        <button class="icon-btn" id="home-back-btn" aria-label="뒤로" hidden>←</button>
        <h1 id="home-title">진담한자톡</h1>
        <div class="header-actions">
          <button class="pill-btn outline" id="open-exam-btn">🎓<span class="lbl">시험장</span></button>
          <button class="pill-btn soft" id="open-review-btn">📝<span class="lbl">복습장</span></button>
          <button class="icon-btn" id="bgm-btn" aria-label="배경음악 켜기/끄기">🔊</button>
        </div>
      </header>
      <nav class="level-tabs" id="level-tabs"></nav>
      <p class="home-hint" id="home-hint"></p>
      <div class="grid-wrap" id="grid-wrap">
        <div class="day-grid" id="day-grid"></div>
      </div>
    </section>

    <!-- 쓰기 화면 -->
    <section id="study-screen" class="screen">
      <div class="study-nav">
        <button class="back-text-btn" id="back-btn">← 그만하기</button>
        <div class="step-indicator" id="step-indicator"></div>
      </div>

      <div class="study-info">
        <p class="study-desc" id="study-desc"></p>
        <div class="study-title-row">
          <span id="study-title-text" class="study-title"></span>
          <button class="tts-btn" id="tts-btn" aria-label="발음 듣기">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path
                d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"
              />
            </svg>
          </button>
        </div>
        <div id="pinyin-display" class="pinyin-display"></div>
      </div>

      <div class="writer-box" id="writer-box">
        <div id="writer-target"></div>
      </div>

      <div class="study-bottom">
        <div id="story-card" class="story-card">
          <span class="story-icon">💡</span>
          <span id="story-text"></span>
        </div>
        <div class="status-msg" id="status-msg"></div>
        <div class="btn-group">
          <button class="action-btn" id="hint-btn">모범 획순 보기</button>
          <button class="action-btn primary" id="next-btn" hidden>다음</button>
        </div>
      </div>
    </section>

    <!-- 한자 고르기 (복습장) / 룰렛 (시험장) -->
    <div id="pick-modal" class="modal-overlay" hidden>
      <div class="modal-content">
        <h2 id="pick-title"></h2>
        <p id="pick-msg"></p>
        <div id="pick-grid" class="pick-grid"></div>
        <button class="action-btn" id="pick-cancel-btn">뒤로 가기</button>
      </div>
    </div>

    <!-- 알림창 -->
    <div id="alert-modal" class="modal-overlay top" hidden>
      <div class="modal-content small">
        <h2 id="alert-title">알림</h2>
        <p id="alert-msg"></p>
        <button class="action-btn primary" id="alert-btn">확인</button>
      </div>
    </div>

    <script src="data.js"></script>
    <script src="scripts.js"></script>
  </body>
</html>
